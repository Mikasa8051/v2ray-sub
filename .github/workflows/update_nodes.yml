name: Auto Update V2Ray Nodes

on:
  schedule:
    # 每 6 小时自动运行一次真实测速并更新
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持在 GitHub 控制台手动触发运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies & Install sing-box Engine
        run: |
          python -m pip install --upgrade pip
          
          # 在 Ubuntu 环境上一键安装最新版 sing-box 引擎
          sudo bash -c "$(curl -fsSL https://sing-box.app/gpg.key)"
          sudo apt-get update
          sudo apt-get install -y sing-box || {
            # 备用安装渠道
            curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.8.10/sing-box-1.8.10-linux-amd64.tar.gz | tar -xz
            sudo mv sing-box-*/sing-box /usr/local/bin/
          }
          sing-box version

      - name: Run Real Speedtest & Filter Nodes
        run: |
          python main.py

      - name: Commit and Push to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add nekoray_sub.txt public/nekoray_sub.txt
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto update high-speed nodes [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          else
            echo "节点文件未发生变化，跳过 Push。"
          fi
