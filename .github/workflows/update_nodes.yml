name: Auto Update Sub Nodes

on:
  schedule:
    # 每 2 小时定时自动触发 (UTC 时间)
    - cron: '0 */2 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  update-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Sing-box Core
        run: |
          echo "[+] 正在安装 Sing-box 官方最新二进制内核..."
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://sing-box.app/gpg.key | sudo gpg --dearmor --yes -o /etc/apt/keyrings/sing-box.gpg
          echo "deb [signed-by=/etc/apt/keyrings/sing-box.gpg] https://deb.sagernet.org/ * *" | sudo tee /etc/apt/sources.list.d/sing-box.list
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y sing-box || true

      - name: Run Scraper Script
        run: |
          python main.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add nekoray_sub.txt
          
          if git diff --staged --quiet; then
            echo "节点没有变化，跳过提交"
          else
            git commit -m "🤖 Auto Update: 自动筛选并更新优质订阅节点"
            git push
          fi
