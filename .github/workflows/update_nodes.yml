name: Auto Update Sub Nodes

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run Scraper Script
        run: |
          python main.py

      - name: Commit and Push to GitHub
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add nekoray_sub.txt
          if git diff --staged --quiet; then
            echo "节点没有变化，跳过 GitHub 提交"
          else
            git commit -m "🤖 Auto Update: 精确剔除假SNI并更新节点订阅"
            git push
          fi

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/renyong_8051/v2ray-sub.git
          git push -f gitee main:master
