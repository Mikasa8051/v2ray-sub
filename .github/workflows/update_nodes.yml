name: Auto Update Sub Nodes

# 触发条件
on:
  schedule:
    # 每 2 小时运行一次 (使用 UTC 时间)
    - cron: '0 */2 * * *'
  workflow_dispatch: # 允许在 GitHub 网页端手动点击运行测试

jobs:
  update-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Scraper Script
        run: |
          python main.py

      - name: Commit and Push Changes
        run: |
          # 配置虚拟机器人账号
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 暂存生成的订阅文件
          git add nekoray_sub.txt
          
          # 判断文件是否有更新，如果有则提交并推送
          if git diff --staged --quiet; then
            echo "节点没有变化，跳过提交"
          else
            git commit -m "🤖 Auto Update: 更新免费订阅节点"
            git push
          fi
