name: Auto Update V2Ray Nodes

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动测试并更新一次
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies & Download sing-box
        run: |
          python -m pip install --upgrade pip
          
          # 直接下载官方 Release 静态可执行文件，避免镜像或参数解析报错
          curl -sSL "https://github.com/SagerNet/sing-box/releases/download/v1.9.3/sing-box-1.9.3-linux-amd64.tar.gz" -o sing-box.tar.gz
          tar -zxvf sing-box.tar.gz
          sudo mv sing-box-1.9.3-linux-amd64/sing-box /usr/local/bin/
          rm -rf sing-box.tar.gz sing-box-1.9.3-linux-amd64
          
          sing-box version

      - name: Run Real Speedtest & Filter Nodes
        run: |
          python main.py

      - name: Commit and Push to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add nekoray_sub.txt public/nekoray_sub.txt
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto update high-speed nodes [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          else
            echo "节点无变化，无需提交。"
          fi
