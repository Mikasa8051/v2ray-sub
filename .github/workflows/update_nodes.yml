name: Auto Update Sub Nodes

on:
  schedule:
    - cron: '0 */2 * * *' # 每 2 小时运行一次
  workflow_dispatch:

jobs:
  update-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Sing-box Core
        run: |
          # 自动下载并安装最新的 Sing-box 官方内核，用于真实协议检测
          echo "[+] 安装 Sing-box 内核..."
          curl -fsSL https://sing-box.app/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/sing-box.gpg
          echo "deb [signed-by=/etc/apt/keyrings/sing-box.gpg] https://deb.sagernet.org/ * *" | sudo tee /etc/apt/sources.list.d/sing-box.list
          sudo apt-get update
          sudo apt-get install -y sing-box || true

      - name: Run Scraper Script
        run: |
          python main.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add nekoray_sub.txt
          
          if git diff --staged --quiet; then
            echo "节点没有变化，跳过提交"
          else
            git commit -m "🤖 Auto Update: 自动筛选并更新优质节点"
            git push
          fi
