name: Auto Update V2Ray Subscription

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行抓取与生成
        run: |
          python main.py

      - name: 发布生成结果至 gh-pages 分支
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 创建并切换到空白的 gh-pages 分支
          git checkout --orphan gh-pages
          
          # 仅暂存生成的节点文件
          git reset
          git add -f nekoray_sub.txt
          
          # 提交并强推到 remote 的 gh-pages 分支
          git commit -m "Auto update subscription [skip ci]"
          git push -f origin gh-pages
